# Advances any queued or stalled run.
#
# A tick works for about four minutes and then hands back, so a long run takes
# several invocations. This provides them. It also recovers a run that stopped
# for any other reason — a cold start that timed out, a deploy landing
# mid-run, Keepa's token bucket running dry.
#
# Free: GitHub Actions on a repo that already exists.
name: Pipeline watchdog

on:
  schedule:
    # Every ten minutes. Vercel's Hobby plan allows one cron a day, which is
    # why this lives here rather than in vercel.json.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Advance the queue
        env:
          # The site address is public, so it lives here rather than in a
          # secret. Asking for it as one added a second thing to configure and
          # a second thing to get wrong, for no protection at all.
          SITE_URL: https://project-claudinho.vercel.app
          WATCHDOG_SECRET: ${{ secrets.WATCHDOG_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${WATCHDOG_SECRET}" ]; then
            echo "WATCHDOG_SECRET is not set as a repository secret."
            echo "Add it under Settings -> Secrets and variables -> Actions,"
            echo "matching the value set in Vercel."
            exit 1
          fi

          # A tick returns when its time budget is spent, so several are needed
          # for a long run. Three per firing, every ten minutes, paces
          # comfortably inside Keepa's refill rate of twenty tokens a minute.
          for attempt in 1 2 3; do
            echo "--- tick ${attempt} ---"
            code=$(curl -sS -o /tmp/tick.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-watchdog-secret: ${WATCHDOG_SECRET}" \
              --max-time 280 \
              "${SITE_URL}/api/pipeline/tick" || echo "000")

            echo "HTTP ${code}"
            head -c 600 /tmp/tick.json || true
            echo

            if [ "${code}" = "401" ]; then
              echo "Rejected. The secret here does not match the one in Vercel."
              exit 1
            fi

            # Nothing queued, or waiting on Keepa tokens. Either way there is
            # no point hammering it — the next firing is ten minutes away and
            # the bucket refills in that time.
            if grep -q '"idle":true' /tmp/tick.json 2>/dev/null; then
              echo "Nothing to do."
              break
            fi
            if grep -q '"waiting":true' /tmp/tick.json 2>/dev/null; then
              echo "Waiting for Keepa tokens. Stopping until the next firing."
              break
            fi
          done
